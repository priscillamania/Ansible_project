# .gitlab-ci.yml
stages:
  - deploy

deploy_infrastructure:
  stage: deploy
  image: python:3.12-slim # Image Docker avec Python pour installer Ansible
  
  before_script:
    # 1. Installer Ansible
    - pip install ansible-core
    # 2. Configurer la clé SSH pour que le runner puisse se connecter aux VMs
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H 192.168.1.54 192.168.1.26 >> ~/.ssh/known_hosts
  
  script:
    # 3. Lancer les playbooks Ansible
    - cd scripts/scenarios
    - ansible-playbook -i inventory.ini install-clamav.yml
    - ansible-playbook -i inventory.ini install-vuln-page.yml
  
  only:
    - main # Le pipeline ne se lance que sur la branche mainy
